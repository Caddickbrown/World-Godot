name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # The native kernels (native/build.sh) build with the runner's Rust;
      # the test suite then checks them against the GDScript fallback.
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/world_kernels/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/world_kernels/Cargo.lock', 'native/world_kernels/src/**') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Import, boot, tests and soak
        run: GODOT=$HOME/godot/godot tests/run_ci.sh

  # A playable Linux build of every green push: an artifact on the run page
  # (Actions -> the run -> Artifacts), and on a v* tag, a GitHub Release.
  export-linux:
    needs: headless-tests
    runs-on: ubuntu-22.04   # older glibc in the native library, for older distros
    permissions:
      contents: write       # only used to publish a release on v* tags
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # Just the two Linux templates (~140 MB) out of the 1.3 GB archive.
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: templates-${{ env.GODOT_VERSION }}-linux

      - name: Fetch export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: python3 tools/export/fetch_templates.py "$GODOT_VERSION" linux_release.x86_64 linux_debug.x86_64

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/world_kernels/target
          key: rust-export-${{ runner.os }}-22.04-${{ hashFiles('native/world_kernels/Cargo.lock', 'native/world_kernels/src/**') }}
          restore-keys: rust-export-${{ runner.os }}-22.04-

      - name: Build, export and smoke-run
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && VERSION="$GITHUB_REF_NAME"
          GODOT=$HOME/godot/godot tools/export/build_linux.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: World-linux-x86_64
          path: dist/*.tar.gz
          retention-days: 14
          compression-level: 0   # already gzipped

      - name: Publish release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "World $GITHUB_REF_NAME" --generate-notes

