name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # The native kernels (native/build.sh) build with the runner's Rust;
      # the test suite then checks them against the GDScript fallback.
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/world_kernels/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/world_kernels/Cargo.lock', 'native/world_kernels/src/**') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Import, boot, tests and soak
        run: GODOT=$HOME/godot/godot tests/run_ci.sh

  # ── Builds ─────────────────────────────────────────────────────────────────
  # Every green push makes playable builds for Linux, Windows and macOS: the
  # run's Artifacts. A v* tag also publishes them as a GitHub Release.
  # The native kernels are compiled on each OS; Godot exports all three from
  # Linux; then each build is smoke-run on its own OS.

  native-libs:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/world_kernels/target
          key: rust-pkg-${{ matrix.platform }}-${{ hashFiles('native/world_kernels/Cargo.lock', 'native/world_kernels/src/**') }}
          restore-keys: rust-pkg-${{ matrix.platform }}-

      # Linux: built against glibc 2.28, the same floor as Godot's own build.
      - name: Install cargo-zigbuild
        if: matrix.platform == 'linux'
        run: pip install ziglang cargo-zigbuild

      - name: Build the native kernels
        run: native/package.sh

      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: native/bin/${{ matrix.platform }}/
          retention-days: 1

  export:
    needs: [headless-tests, native-libs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # Just the templates these exports use, out of the 1.3 GB archive.
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v5
        with:
          path: ~/.local/share/godot/export_templates
          key: templates-${{ env.GODOT_VERSION }}-desktop

      - name: Fetch export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: >
          python3 tools/export/fetch_templates.py "$GODOT_VERSION"
          linux_release.x86_64 linux_debug.x86_64
          windows_release_x86_64.exe windows_debug_x86_64.exe macos.zip

      - uses: actions/download-artifact@v7
        with: { name: native-linux, path: native/bin/linux }
      - uses: actions/download-artifact@v7
        with: { name: native-windows, path: native/bin/windows }
      - uses: actions/download-artifact@v7
        with: { name: native-macos, path: native/bin/macos }

      - name: Export Linux, Windows and macOS (and smoke-run Linux)
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && VERSION="$GITHUB_REF_NAME"
          GODOT=$HOME/godot/godot VERSION="$VERSION" tools/export/export.sh linux windows macos

      - uses: actions/upload-artifact@v6
        with:
          name: World-linux-x86_64
          path: dist/*-linux-x86_64.tar.gz
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: World-windows-x86_64
          path: dist/*-windows-x86_64.zip
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: World-macos-universal
          path: dist/*-macos-universal.zip
          retention-days: 14
          compression-level: 0

  # Each build started on its own OS: boots, logs no errors, kernels on.
  smoke:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: World-windows-x86_64 }
          - { os: macos-latest, artifact: World-macos-universal }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with: { sparse-checkout: tools/export }
      - uses: actions/download-artifact@v7
        with: { name: "${{ matrix.artifact }}", path: pkg }
      - name: Unpack and run
        run: |
          cd pkg && { command -v unzip >/dev/null && unzip -q ./*.zip || 7z x -y ./*.zip >/dev/null; } && cd ..
          if [ "$RUNNER_OS" = Windows ]; then BIN=$(ls pkg/*/World.exe); else BIN=$(ls -d pkg/*.app)/Contents/MacOS/World-Godot; fi
          tools/export/smoke.sh "$BIN" yes

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with: { pattern: World-*, path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "World $GITHUB_REF_NAME" --generate-notes

